# VOID // AGENT LAB — served under /voidagentlab/ (path preserved; Traefik does NOT strip it)
server {
    listen 80 default_server;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;

    # Canonical redirect: /voidagentlab -> /voidagentlab/
    location = /voidagentlab {
        return 301 /voidagentlab/;
    }

    # Application root + SPA fallback to the app index
    location /voidagentlab/ {
        alias /usr/share/nginx/html/voidagentlab/;
        index index.html;
        try_files $uri $uri/ /voidagentlab/index.html;
    }

    # Hashed assets: long immutable cache (matches pre35 /static/ convention)
    location /voidagentlab/assets/ {
        alias /usr/share/nginx/html/voidagentlab/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Entry document must never be cached
    location = /voidagentlab/index.html {
        alias /usr/share/nginx/html/voidagentlab/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Pixel-art Jump Gate Marker: 24x24 logical pixels at 2x scale -->
  <!-- Palette: Cyan nav (#00d4ff), Dark space (#0a0a0a) -->
  <defs>
    <style>
      .gate-ring { fill: none; stroke: #00d4ff; stroke-width: 2; }
      .gate-ring-inner { fill: none; stroke: #00d4ff; stroke-width: 1; opacity: 0.6; }
      .gate-glow { fill: #00d4ff; opacity: 0.15; }
      .gate-core { fill: #001a2a; }
      .gate-core-glow { fill: #00d4ff; opacity: 0.3; }
      .chevron { fill: none; stroke: #00d4ff; stroke-width: 1.5; }
      .chevron-dim { fill: none; stroke: #00d4ff; stroke-width: 1; opacity: 0.5; }
    </style>
  </defs>

  <!-- Outer glow -->
  <circle cx="24" cy="24" r="22" class="gate-glow"/>

  <!-- Outer ring -->
  <circle cx="24" cy="24" r="18" class="gate-ring"/>

  <!-- Inner ring -->
  <circle cx="24" cy="24" r="12" class="gate-ring-inner"/>

  <!-- Chevron markers (8 around ring) - cardinal directions -->
  <g class="chevron">
    <!-- North -->
    <path d="M24,6 L20,12 M24,6 L28,12"/>
    <!-- East -->
    <path d="M42,24 L36,20 M42,24 L36,28"/>
    <!-- South -->
    <path d="M24,42 L20,36 M24,42 L28,36"/>
    <!-- West -->
    <path d="M6,24 L12,20 M6,24 L12,28"/>
  </g>

  <!-- Chevron markers - diagonal directions (dim) -->
  <g class="chevron-dim">
    <path d="M12,12 L18,18 M12,12 L18,6"/>
    <path d="M36,12 L30,18 M36,12 L30,6"/>
    <path d="M36,36 L30,30 M36,36 L30,42"/>
    <path d="M12,36 L18,30 M12,36 L18,42"/>
  </g>

  <!-- Center event horizon -->
  <circle cx="24" cy="24" r="6" class="gate-core"/>
  <circle cx="24" cy="24" r="4" class="gate-core-glow"/>
</svg>
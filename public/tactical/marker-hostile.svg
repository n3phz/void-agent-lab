<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Hostile: red diamond outline, directional/velocity vector, small contact identifier -->
  <defs>
    <linearGradient id="hostileHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="hostileGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer diamond - hostile marker -->
  <polygon points="24,2 46,24 24,46 2,24" 
           fill="none" stroke="#ff6b6b" stroke-width="2.5" filter="url(#hostileGlow)"/>
  
  <!-- Inner diamond - hull -->
  <polygon points="24,10 36,24 24,38 12,24" 
           fill="url(#hostileHull)" opacity="0.6" stroke="#cc0000" stroke-width="1" opacity="0.8"/>
  
  <!-- Directional/velocity vector - nose cone -->
  <polygon points="24,2 20,14 28,14" fill="#ff6b6b" opacity="0.9"/>
  
  <!-- Threat indicator - small pulsing ring (handled via CSS animation) -->
  <!-- Core identifier -->
  <circle cx="24" cy="24" r="4" fill="#cc0000" opacity="0.8"/>
  
  <!-- Side threat sensors -->
  <rect x="6" y="22" width="4" height="4" rx="0.5" fill="#ff6b6b" opacity="0.6"/>
  <rect x="38" y="22" width="4" height="4" rx="0.5" fill="#ff6b6b" opacity="0.6"/>
  
  <!-- Rear engine hint -->
  <polygon points="20,36 24,42 28,36" fill="#ffb86b" opacity="0.7"/>
</svg>
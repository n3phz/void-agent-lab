<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Scout: compact reconnaissance craft, narrow/agile silhouette, forward sensor array, rear propulsion -->
  <defs>
    <linearGradient id="scoutHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6ecff6;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#4a9fd8;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2d6b9e;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="scoutAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8e6cf;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#6ecff6;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="scoutGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main hull - narrow delta wing -->
  <path d="M32 4 L44 52 L38 58 L26 58 L20 52 Z" 
        fill="url(#scoutHull)" stroke="#4a4a4a" stroke-width="0.8" filter="url(#scoutGlow)"/>
  
  <!-- Cockpit/sensor array - forward -->
  <ellipse cx="32" cy="16" rx="6" ry="4" fill="#1a1a2e" stroke="#6ecff6" stroke-width="0.6"/>
  <ellipse cx="32" cy="14" rx="3" ry="2" fill="#6ecff6" opacity="0.3"/>
  
  <!-- Central spine -->
  <path d="M32 20 L32 44" stroke="#4a4a4a" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Wing details - sensor strips -->
  <path d="M38 28 L44 36" stroke="#6ecff6" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  <path d="M26 28 L20 36" stroke="#6ecff6" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Propulsion - rear -->
  <rect x="24" y="50" width="4" height="8" rx="1" fill="#ffb86b" opacity="0.8"/>
  <rect x="36" y="50" width="4" height="8" rx="1" fill="#ffb86b" opacity="0.8"/>
  
  <!-- Maneuvering thrusters - small teal -->
  <circle cx="30" cy="44" r="1.5" fill="#a8e6cf" opacity="0.7"/>
  <circle cx="34" cy="44" r="1.5" fill="#a8e6cf" opacity="0.7"/>
  
  <!-- Directional indicator - nose marker -->
  <polygon points="32,0 30,6 34,6" fill="#a8e6cf" opacity="0.9"/>
</svg>
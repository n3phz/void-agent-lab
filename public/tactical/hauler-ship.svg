<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 56" width="140" height="56">
  <defs>
    <linearGradient id="haulerHull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="haulerCargo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#a07010"/>
    </linearGradient>
    <linearGradient id="haulerAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8b020"/>
      <stop offset="100%" stop-color="#c08010"/>
    </linearGradient>
    <radialGradient id="haulerEngineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a3c"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Main hull - blocky industrial design -->
  <rect x="10" y="18" width="120" height="20" rx="3" fill="url(#haulerHull)" stroke="#555" stroke-width="0.5"/>
  <!-- Cockpit section -->
  <rect x="10" y="14" width="28" height="28" rx="3" fill="url(#haulerHull)" stroke="#555" stroke-width="0.5"/>
  <rect x="14" y="18" width="20" height="14" rx="2" fill="#0a1420" stroke="#3a4a5a" stroke-width="0.5"/>
  <rect x="16" y="20" width="16" height="10" rx="1" fill="#1a2a3a" opacity="0.8"/>
  <!-- Cargo sections -->
  <rect x="42" y="14" width="22" height="28" rx="2" fill="url(#haulerCargo)" stroke="#8a6010" stroke-width="0.5"/>
  <rect x="68" y="14" width="22" height="28" rx="2" fill="url(#haulerCargo)" stroke="#8a6010" stroke-width="0.5"/>
  <rect x="94" y="14" width="22" height="28" rx="2" fill="url(#haulerCargo)" stroke="#8a6010" stroke-width="0.5"/>
  <!-- Cargo panel lines -->
  <line x1="53" y1="14" x2="53" y2="42" stroke="#8a6010" stroke-width="0.3"/>
  <line x1="79" y1="14" x2="79" y2="42" stroke="#8a6010" stroke-width="0.3"/>
  <line x1="42" y1="24" x2="64" y2="24" stroke="#8a6010" stroke-width="0.3"/>
  <line x1="68" y1="24" x2="90" y2="24" stroke="#8a6010" stroke-width="0.3"/>
  <line x1="94" y1="24" x2="116" y2="24" stroke="#8a6010" stroke-width="0.3"/>
  <!-- Accent stripe -->
  <rect x="10" y="32" width="120" height="2" fill="url(#haulerAccent)" opacity="0.6"/>
  <!-- Thruster section -->
  <rect x="116" y="18" width="14" height="20" rx="2" fill="#1a1a1a" stroke="#444" stroke-width="0.5"/>
  <!-- Engine nozzles -->
  <circle cx="126" cy="22" r="2.5" fill="#333"/>
  <circle cx="126" cy="28" r="2.5" fill="#333"/>
  <circle cx="126" cy="34" r="2.5" fill="#333"/>
  <!-- Engine glow -->
  <circle cx="134" cy="22" r="6" fill="url(#haulerEngineGlow)"/>
  <circle cx="134" cy="28" r="8" fill="url(#haulerEngineGlow)"/>
  <circle cx="134" cy="34" r="6" fill="url(#haulerEngineGlow)"/>
  <!-- Landing struts -->
  <rect x="30" y="42" width="3" height="6" fill="#444"/>
  <rect x="60" y="42" width="3" height="6" fill="#444"/>
  <rect x="90" y="42" width="3" height="6" fill="#444"/>
  <!-- Designation -->
  <text x="70" y="38" font-family="monospace" font-size="4" fill="#e8b020" text-anchor="middle" font-weight="bold">H-01</text>
  <!-- Hull panel lines -->
  <line x1="42" y1="18" x2="42" y2="38" stroke="#555" stroke-width="0.3" opacity="0.5"/>
  <line x1="68" y1="18" x2="68" y2="38" stroke="#555" stroke-width="0.3" opacity="0.5"/>
  <line x1="94" y1="18" x2="94" y2="38" stroke="#555" stroke-width="0.3" opacity="0.5"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Pixel-art Destination Marker: 16x16 logical pixels at 2x scale -->
  <!-- Palette: Amber fuel/cargo (#ff9632) -->
  <defs>
    <style>
      .dest-glow { fill: #ff9632; opacity: 0.12; }
      .dest-ring { fill: none; stroke: #ff9632; stroke-width: 1.5; opacity: 0.6; }
      .dest-core { fill: #ff9632; }
      .dest-core-inner { fill: #cc7700; }
      .dest-diamond { fill: none; stroke: #fff; stroke-width: 1.5; opacity: 0.9; }
      .dest-diamond-inner { fill: #ffaa33; opacity: 0.4; }
    </style>
  </defs>

  <!-- Glow -->
  <circle cx="16" cy="16" r="15" class="dest-glow"/>

  <!-- Outer ring -->
  <circle cx="16" cy="16" r="12" class="dest-ring"/>

  <!-- Core -->
  <circle cx="16" cy="16" r="8" class="dest-core"/>

  <!-- Diamond marker -->
  <path d="M16,4 L28,16 L16,28 L4,16 Z" class="dest-diamond"/>
  <path d="M16,8 L24,16 L16,24 L8,16 Z" class="dest-diamond-inner"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Waypoint: small geometric cyan marker -->
  <defs>
    <filter id="wpGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer diamond -->
  <polygon points="16,2 30,16 16,30 2,16" fill="none" stroke="#6ecff6" stroke-width="2" filter="url(#wpGlow)"/>
  
  <!-- Inner diamond -->
  <polygon points="16,8 24,16 16,24 8,16" fill="#6ecff6" opacity="0.3"/>
  
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#6ecff6"/>
</svg>
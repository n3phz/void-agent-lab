<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Pixel-art Waypoint Marker: 16x16 logical pixels at 2x scale -->
  <!-- Palette: Purple VOID identity (#aa3bff) -->
  <defs>
    <style>
      .wp-glow { fill: #aa3bff; opacity: 0.12; }
      .wp-ring { fill: none; stroke: #aa3bff; stroke-width: 1.5; opacity: 0.6; }
      .wp-core { fill: #aa3bff; }
      .wp-core-inner { fill: #5a1a8a; }
      .wp-dot { fill: #fff; opacity: 0.8; }
      .wp-crosshair { fill: none; stroke: #aa3bff; stroke-width: 1; opacity: 0.5; }
    </style>
  </defs>

  <!-- Glow -->
  <circle cx="16" cy="16" r="15" class="wp-glow"/>

  <!-- Outer ring -->
  <circle cx="16" cy="16" r="12" class="wp-ring"/>

  <!-- Core -->
  <circle cx="16" cy="16" r="8" class="wp-core"/>

  <!-- Inner dot -->
  <circle cx="16" cy="16" r="4" class="wp-dot"/>

  <!-- Crosshair -->
  <line x1="16" y1="2" x2="16" y2="30" class="wp-crosshair"/>
  <line x1="2" y1="16" x2="30" y2="16" class="wp-crosshair"/>
</svg>
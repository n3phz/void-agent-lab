<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Pixel-art Scan Pulse Effect: 60x60 logical pixels at 2x scale -->
  <!-- Palette: Purple VOID identity (#aa3bff) for scan pulses -->
  <defs>
    <style>
      .scan-ring { fill: #aa3bff; opacity: 0.1; }
      .scan-ring-bright { fill: #aa3bff; opacity: 0.18; }
      .scan-center { fill: #aa3bff; opacity: 0.3; }
      .scan-line { fill: none; stroke: #aa3bff; stroke-width: 1; opacity: 0.3; }
      .scan-indicator { fill: #aa3bff; opacity: 0.5; }
    </style>
  </defs>

  <!-- Outer pulse ring 1 (animated via JS - scale from 0 to 1) -->
  <circle cx="60" cy="60" r="50" class="scan-ring" id="pulse1"/>

  <!-- Outer pulse ring 2 (animated via JS - delayed) -->
  <circle cx="60" cy="60" r="35" class="scan-ring-bright" id="pulse2"/>

  <!-- Center glow -->
  <circle cx="60" cy="60" r="20" class="scan-center"/>

  <!-- Scan lines (cardinal + diagonal) -->
  <g class="scan-line">
    <line x1="60" y1="10" x2="60" y2="110"/>      <!-- N-S -->
    <line x1="10" y1="60" x2="110" y2="60"/>      <!-- E-W -->
    <line x1="20" y1="20" x2="100" y2="100"/>     <!-- NW-SE -->
    <line x1="20" y1="100" x2="100" y2="20"/>     <!-- NE-SW -->
  </g>

  <!-- Directional indicators (4 cardinal) -->
  <g class="scan-indicator">
    <polygon points="60,8 56,18 64,18"/>           <!-- N -->
    <polygon points="60,112 56,102 64,102"/>       <!-- S -->
    <polygon points="8,60 18,56 18,64"/>           <!-- W -->
    <polygon points="112,60 102,56 102,64"/>       <!-- E -->
  </g>
</svg>
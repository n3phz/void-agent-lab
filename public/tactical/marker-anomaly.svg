<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Anomaly: geometric teal symbol, scan pulse compatible -->
  <defs>
    <linearGradient id="anomalyCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8e6cf;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#6ecff6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#4a9fd8;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="anomalyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer hexagon - anomaly boundary -->
  <polygon points="24,2 42,10 42,38 24,46 6,38 6,10" 
           fill="none" stroke="#a8e6cf" stroke-width="2" filter="url(#anomalyGlow)"/>
  
  <!-- Inner rotated hexagon -->
  <polygon points="24,10 38,22 38,34 24,46 10,34 10,22" 
           fill="url(#anomalyCore)" opacity="0.3" stroke="#a8e6cf" stroke-width="1" opacity="0.6"/>
  
  <!-- Central triangle - anomaly type indicator -->
  <polygon points="24,16 32,28 16,28" fill="none" stroke="#a8e6cf" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Inner triangle inverted -->
  <polygon points="24,32 32,20 16,20" fill="url(#anomalyCore)" opacity="0.5"/>
  
  <!-- Core energy -->
  <circle cx="24" cy="24" r="4" fill="#a8e6cf" opacity="0.7" filter="url(#anomalyGlow)"/>
  
  <!-- Risk level indicator - small red accent for high risk -->
  <!-- (added dynamically via CSS/class based on risk) -->
</svg>
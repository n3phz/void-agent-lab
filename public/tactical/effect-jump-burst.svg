<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Pixel-art Jump Burst Effect: 60x60 logical pixels at 2x scale -->
  <!-- Palette: Purple VOID identity (#aa3bff), White center, Light purple (#c480ff) -->
  <defs>
    <style>
      .jump-core { 
        fill: #fff; 
        opacity: 1;
      }
      .jump-core-mid { 
        fill: #aa3bff; 
        opacity: 1;
      }
      .jump-core-outer { 
        fill: #5a1a8a; 
        opacity: 1;
      }
      .jump-core-fade { 
        fill: #1a0a2a; 
        opacity: 0;
      }
      .jump-ring1 { fill: #aa3bff; opacity: 0.35; }
      .jump-ring2 { fill: #c480ff; opacity: 0.18; }
      .jump-line { fill: none; stroke: #aa3bff; stroke-width: 1.5; opacity: 0.6; }
      .jump-line-dim { fill: none; stroke: #aa3bff; stroke-width: 1; opacity: 0.35; }
      .jump-particle { fill: #fff; opacity: 0.8; }
    </style>
  </defs>

  <!-- Expanding rings (animated via JS with scale/opacity) -->
  <circle cx="60" cy="60" r="55" class="jump-ring1" id="jumpRing1"/>
  <circle cx="60" cy="60" r="40" class="jump-ring2" id="jumpRing2"/>

  <!-- Central burst (layered) -->
  <circle cx="60" cy="60" r="25" class="jump-core-fade"/>
  <circle cx="60" cy="60" r="18" class="jump-core-outer"/>
  <circle cx="60" cy="60" r="12" class="jump-core-mid"/>
  <circle cx="60" cy="60" r="6" class="jump-core"/>

  <!-- Radial burst lines (8 primary + 4 secondary) -->
  <g class="jump-line">
    <line x1="60" y1="10" x2="60" y2="110"/>      <!-- N-S -->
    <line x1="10" y1="60" x2="110" y2="60"/>      <!-- E-W -->
    <line x1="20" y1="20" x2="100" y2="100"/>     <!-- NW-SE -->
    <line x1="20" y1="100" x2="100" y2="20"/>     <!-- NE-SW -->
  </g>

  <g class="jump-line-dim">
    <line x1="60" y1="30" x2="60" y2="90"/>       <!-- N-S inner -->
    <line x1="30" y1="60" x2="90" y2="60"/>       <!-- E-W inner -->
    <line x1="35" y1="35" x2="85" y2="85"/>       <!-- NW-SE inner -->
    <line x1="35" y1="85" x2="85" y2="35"/>       <!-- NE-SW inner -->
  </g>

  <!-- Particle burst (12 particles in a circle) -->
  <g class="jump-particle">
    <!-- Cardinal -->
    <circle cx="60" cy="15" r="2"/>
    <circle cx="105" cy="60" r="2"/>
    <circle cx="60" cy="105" r="2"/>
    <circle cx="15" cy="60" r="2"/>
    <!-- Diagonal -->
    <circle cx="85" cy="20" r="1.5"/>
    <circle cx="100" cy="40" r="1.5"/>
    <circle cx="100" cy="80" r="1.5"/>
    <circle cx="85" cy="100" r="1.5"/>
    <circle cx="35" cy="100" r="1.5"/>
    <circle cx="20" cy="80" r="1.5"/>
    <circle cx="20" cy="40" r="1.5"/>
    <circle cx="35" cy="20" r="1.5"/>
  </g>
</svg>
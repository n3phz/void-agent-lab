<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="wpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aa3bff"/>
      <stop offset="100%" stop-color="#aa3bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wpCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aa3bff"/>
      <stop offset="100%" stop-color="#5a1a8a"/>
    </radialGradient>
  </defs>
  <!-- Glow -->
  <circle cx="24" cy="24" r="22" fill="url(#wpGlow)"/>
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="#aa3bff" stroke-width="2" opacity="0.6"/>
  <!-- Core -->
  <circle cx="24" cy="24" r="12" fill="url(#wpCore)"/>
  <!-- Inner dot -->
  <circle cx="24" cy="24" r="6" fill="#fff" opacity="0.8"/>
  <!-- Crosshair -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#aa3bff" stroke-width="1" opacity="0.5"/>
  <line x1="4" y1="24" x2="44" y2="24" stroke="#aa3bff" stroke-width="1" opacity="0.5"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64">
  <defs>
    <!-- Engine glow filter -->
    <filter id="engineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Hull gradient -->
    <linearGradient id="scoutHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0d1018"/>
    </linearGradient>
    
    <!-- Panel lines -->
    <linearGradient id="panelLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a3244"/>
      <stop offset="50%" stop-color="#3a4458"/>
      <stop offset="100%" stop-color="#2a3244"/>
    </linearGradient>
    
    <!-- Nav lights -->
    <radialGradient id="navLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4deeea" stop-opacity="1"/>
      <stop offset="60%" stop-color="#4deeea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4deeea" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Engine exhaust -->
    <radialGradient id="engineExhaust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4deeea" stop-opacity="1"/>
      <stop offset="40%" stop-color="#4deeea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a1f2e" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Sensor glow -->
    <radialGradient id="sensorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4deeea" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4deeea" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Main hull - narrow wedge silhouette -->
  <g filter="url(#engineGlow)">
    <!-- Engine exhaust (behind ship) -->
    <ellipse cx="8" cy="32" rx="14" ry="5" fill="url(#engineExhaust)" opacity="0.6"/>
    <ellipse cx="6" cy="32" rx="10" ry="3" fill="#4deeea" opacity="0.4"/>
    
    <!-- Main fuselage - long narrow wedge -->
    <path d="M 20 32 L 118 12 L 118 52 Z" fill="url(#scoutHull)" stroke="#2a3244" stroke-width="1.5"/>
    
    <!-- Upper hull plating -->
    <path d="M 20 32 L 110 18 L 110 32 Z" fill="#1a1f2e" opacity="0.6"/>
    
    <!-- Lower hull plating -->
    <path d="M 20 32 L 110 46 L 110 32 Z" fill="#0d1018" opacity="0.6"/>
    
    <!-- Cockpit / sensor nose -->
    <path d="M 110 26 L 122 32 L 110 38 Z" fill="#0f131a" stroke="#2a3244" stroke-width="1"/>
    <ellipse cx="118" cy="32" rx="4" ry="6" fill="#141824" stroke="#3a4458" stroke-width="0.5"/>
    
    <!-- Sensor array - distinctive forward protrusion -->
    <path d="M 110 20 L 128 32 L 110 44" fill="none" stroke="#3a4458" stroke-width="2" stroke-linecap="round"/>
    <circle cx="128" cy="32" r="3" fill="url(#sensorGlow)"/>
    <circle cx="128" cy="32" r="1.5" fill="#4deeea"/>
    
    <!-- Winglets - distinctive compact wings -->
    <!-- Upper wing -->
    <path d="M 45 20 L 70 4 L 75 18 Z" fill="url(#scoutHull)" stroke="#2a3244" stroke-width="1"/>
    <path d="M 45 20 L 60 8 L 65 18 Z" fill="#1a1f2e" opacity="0.5"/>
    
    <!-- Lower wing -->
    <path d="M 45 44 L 70 60 L 75 46 Z" fill="url(#scoutHull)" stroke="#2a3244" stroke-width="1"/>
    <path d="M 45 44 L 60 56 L 65 46 Z" fill="#0d1018" opacity="0.5"/>
    
    <!-- Nav lights on wing tips -->
    <circle cx="70" cy="4" r="2.5" fill="url(#navLight)"/>
    <circle cx="70" cy="60" r="2.5" fill="url(#navLight)"/>
    
    <!-- Engine nacelles - small rear clusters -->
    <!-- Upper nacelle -->
    <path d="M 12 28 L 20 22 L 20 38 Z" fill="#1a1f2e" stroke="#2a3244" stroke-width="1"/>
    <ellipse cx="12" cy="32" rx="5" ry="8" fill="#0f131a" stroke="#2a3244" stroke-width="0.5"/>
    <ellipse cx="10" cy="32" rx="3" ry="5" fill="url(#engineExhaust)"/>
    
    <!-- Lower nacelle -->
    <path d="M 12 36 L 20 30 L 20 46 Z" fill="#1a1f2e" stroke="#2a3244" stroke-width="1"/>
    <ellipse cx="10" cy="32" rx="3" ry="5" fill="url(#engineExhaust)"/>
    
    <!-- Panel lines - technical details -->
    <line x1="30" y1="22" x2="95" y2="22" stroke="url(#panelLine)" stroke-width="0.5" opacity="0.6"/>
    <line x1="30" y1="42" x2="95" y2="42" stroke="url(#panelLine)" stroke-width="0.5" opacity="0.6"/>
    <line x1="35" y1="22" x2="35" y2="42" stroke="url(#panelLine)" stroke-width="0.5" opacity="0.4"/>
    <line x1="60" y1="22" x2="60" y2="42" stroke="url(#panelLine)" stroke-width="0.5" opacity="0.4"/>
    <line x1="85" y1="22" x2="85" y2="42" stroke="url(#panelLine)" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Hull identification marking -->
    <text x="70" y="35" font-family="ui-monospace, Consolas, monospace" font-size="5" fill="#3a4458" text-anchor="middle" opacity="0.5">SCOUT</text>
    
    <!-- Cargo/payload bay indicator (small) -->
    <rect x="50" y="28" width="12" height="8" rx="1" fill="none" stroke="#3a4458" stroke-width="0.5" opacity="0.5"/>
    <line x1="52" y1="32" x2="60" y2="32" stroke="#3a4458" stroke-width="0.5" opacity="0.3"/>
  </g>
</svg>
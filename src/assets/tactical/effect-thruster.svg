<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="thrusterCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="40%" stop-color="#ff9a3c"/>
      <stop offset="80%" stop-color="#e85a1a"/>
      <stop offset="100%" stop-color="#8a2a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="thrusterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff9a3c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thrusterPlume" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ff9a3c" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#e85a1a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8a2a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Thruster nozzle glow -->
  <circle cx="32" cy="8" r="10" fill="url(#thrusterGlow)"/>
  <!-- Main plume -->
  <ellipse cx="32" cy="40" rx="12" ry="28" fill="url(#thrusterPlume)"/>
  <!-- Core plume -->
  <ellipse cx="32" cy="38" rx="6" ry="20" fill="url(#thrusterCore)"/>
  <!-- Flicker particles -->
  <g fill="#ffb860" opacity="0.7">
    <circle cx="28" cy="20" r="2"/>
    <circle cx="36" cy="22" r="1.5"/>
    <circle cx="26" cy="30" r="1.5"/>
    <circle cx="38" cy="32" r="1"/>
    <circle cx="24" cy="40" r="1"/>
    <circle cx="40" cy="42" r="1.5"/>
    <circle cx="30" cy="48" r="2"/>
    <circle cx="34" cy="52" r="1.5"/>
  </g>
  <!-- Outer glow particles -->
  <g fill="#ff8020" opacity="0.4">
    <circle cx="20" cy="25" r="1.5"/>
    <circle cx="44" cy="28" r="1"/>
    <circle cx="18" cy="40" r="1.5"/>
    <circle cx="46" cy="45" r="1"/>
    <circle cx="22" cy="55" r="1"/>
    <circle cx="42" cy="58" r="1"/>
  </g>
</svg>
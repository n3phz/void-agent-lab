<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="gateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gateRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0080aa"/>
    </radialGradient>
  </defs>
  <!-- Glow -->
  <circle cx="24" cy="24" r="22" fill="url(#gateGlow)"/>
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="url(#gateRing)" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="24" cy="24" r="12" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
  <!-- Chevron markers (8 around ring) -->
  <g stroke="#00d4ff" stroke-width="2" fill="none">
    <path d="M24,6 L20,12 M24,6 L28,12"/>
    <path d="M42,24 L36,20 M42,24 L36,28"/>
    <path d="M24,42 L20,36 M24,42 L28,36"/>
    <path d="M6,24 L12,20 M6,24 L12,28"/>
    <path d="M12,12 L18,18 M12,12 L18,6" opacity="0.5"/>
    <path d="M36,12 L30,18 M36,12 L30,6" opacity="0.5"/>
    <path d="M36,36 L30,30 M36,36 L30,42" opacity="0.5"/>
    <path d="M12,36 L18,30 M12,36 L18,42" opacity="0.5"/>
  </g>
  <!-- Center event horizon -->
  <circle cx="24" cy="24" r="6" fill="#001a2a"/>
  <circle cx="24" cy="24" r="4" fill="#00d4ff" opacity="0.3"/>
</svg>
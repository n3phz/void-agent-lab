<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="anomGlowLow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="anomGlowHigh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="anomCoreLow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#1a8a3a"/>
    </radialGradient>
    <radialGradient id="anomCoreHigh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#a02a2a"/>
    </radialGradient>
  </defs>
  <!-- Low risk anomaly (default) -->
  <g id="anomaly-low">
    <!-- Glow -->
    <circle cx="24" cy="24" r="22" fill="url(#anomGlowLow)"/>
    <!-- Outer hexagon -->
    <polygon points="24,6 40,14 40,34 24,42 8,34 8,14" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
    <!-- Core -->
    <polygon points="24,10 36,16 36,32 24,38 12,32 12,16" fill="url(#anomCoreLow)" opacity="0.8"/>
    <!-- Inner scan lines -->
    <line x1="24" y1="14" x2="24" y2="34" stroke="#4ade80" stroke-width="1" opacity="0.4"/>
    <line x1="14" y1="24" x2="34" y2="24" stroke="#4ade80" stroke-width="1" opacity="0.4"/>
    <line x1="16" y1="16" x2="32" y2="32" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
    <line x1="16" y1="32" x2="32" y2="16" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- High risk anomaly -->
  <g id="anomaly-high" display="none">
    <!-- Glow -->
    <circle cx="24" cy="24" r="24" fill="url(#anomGlowHigh)"/>
    <!-- Outer triangle (warning) -->
    <polygon points="24,4 42,40 6,40" fill="none" stroke="#f87171" stroke-width="3" opacity="0.8"/>
    <!-- Core -->
    <polygon points="24,10 38,34 10,34" fill="url(#anomCoreHigh)" opacity="0.8"/>
    <!-- Exclamation -->
    <text x="24" y="30" font-family="monospace" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">!</text>
    <!-- Pulsing ring (animated via CSS/JS) -->
    <circle cx="24" cy="24" r="18" fill="none" stroke="#f87171" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="18;22;18" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
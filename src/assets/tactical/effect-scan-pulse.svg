<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="scanPulse1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aa3bff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#aa3bff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#aa3bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scanPulse2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aa3bff" stop-opacity="0"/>
      <stop offset="80%" stop-color="#aa3bff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#aa3bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scanCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aa3bff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#aa3bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer pulse ring 1 (animated via JS) -->
  <circle cx="60" cy="60" r="50" fill="url(#scanPulse1)" id="pulse1"/>
  <!-- Outer pulse ring 2 (animated via JS) -->
  <circle cx="60" cy="60" r="35" fill="url(#scanPulse2)" id="pulse2"/>
  <!-- Center glow -->
  <circle cx="60" cy="60" r="20" fill="url(#scanCenter)"/>
  <!-- Scan lines -->
  <g stroke="#aa3bff" stroke-width="1" opacity="0.3">
    <line x1="60" y1="10" x2="60" y2="110"/>
    <line x1="10" y1="60" x2="110" y2="60"/>
    <line x1="20" y1="20" x2="100" y2="100"/>
    <line x1="20" y1="100" x2="100" y2="20"/>
  </g>
  <!-- Directional indicators -->
  <g fill="#aa3bff" opacity="0.5">
    <polygon points="60,8 56,18 64,18"/>
    <polygon points="60,112 56,102 64,102"/>
    <polygon points="8,60 18,56 18,64"/>
    <polygon points="112,60 102,56 102,64"/>
  </g>
</svg>